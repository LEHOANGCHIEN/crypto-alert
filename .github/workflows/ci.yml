name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: crypto_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d crypto_alert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI only has the test database; local dev uses crypto_alert as well (docker-compose).
      DATABASE_URL: postgresql://app:app@localhost:5432/crypto_alert_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/crypto_alert_test
      JWT_ACCESS_SECRET: ci only - not a real secret value!!!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        working-directory: backend

      - run: npm run secrets:check -- --all
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Integration tests
        run: npm run test:integration
      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
